name: thiscord-turn
services:
  coturn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.29.250.2
    # Docker Desktop uses published ports, not the WSL distro's host network.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49259:49160-49259/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/coturn
    cap_drop: [ALL]
    # The official turnserver binary carries this file capability; its bounding
    # set must retain it even though our listeners use unprivileged ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, turnutils_stunclient, -p, "3478", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.250.0/24
