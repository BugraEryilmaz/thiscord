name: thiscord-turn
services:
  coturn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    # Native Linux: avoid Docker NAT for STUN and relay allocations.
    network_mode: host
    volumes:
      - /etc/thiscord/coturn.conf:/etc/coturn/turnserver.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/coturn
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, turnutils_stunclient, -p, "3478", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
