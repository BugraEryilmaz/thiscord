[package]
name = "thiscord-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
resend-rs = { version = "0.32.3", default-features = false, features = ["rustls-tls"] }
thiscord-shared.workspace = true
axum = { version = "0.8", features = ["ws"] }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
diesel_migrations = { version = "2.3", features = ["postgres"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["now"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
url = "2"
