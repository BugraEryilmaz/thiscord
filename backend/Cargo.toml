[package]
name = "thiscord-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes the isolated benchmark router; normal application limits stay unchanged.
load-test = []

[[example]]
name = "voice_load_server"
required-features = ["load-test"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
url = "2"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
resend-rs = { version = "0.32.3", default-features = false, features = ["rustls-tls"] }
thiscord-shared.workspace = true
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
diesel_migrations = { version = "2.3", features = ["postgres"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["now"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.21.0"
rtc = "0.21.0"
async-trait = "0.1"
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
rcgen = "0.14"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
url = "2"
