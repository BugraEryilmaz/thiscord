<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} · Thiscord</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17181e; color: #f2f3f5; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
        main { width: 100%; max-width: 460px; padding: 32px; border: 1px solid #ffffff20; border-radius: 16px; background: #202127; box-shadow: 0 20px 60px #0004; }
        .brand { color: #a5adff; font-size: 13px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
        h1 { font-size: 26px; line-height: 1.25; margin: 16px 0; }
        p { color: #b5b7c0; line-height: 1.6; }
        form { display: grid; gap: 12px; margin-top: 24px; }
        label { font-size: 14px; font-weight: 600; }
        input { width: 100%; border: 1px solid #ffffff30; border-radius: 6px; padding: 12px; background: #17181e; color: inherit; font: inherit; margin-bottom: 8px; }
        button { border: 0; border-radius: 6px; padding: 13px; background: #5865f2; color: white; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #4752c4; }
        :focus-visible { outline: 2px solid #a5adff; outline-offset: 3px; }
        footer { margin-top: 24px; color: #90939f; font-size: 11px; overflow-wrap: anywhere; }
        @media (max-width: 400px) { main { padding: 24px; } }
    </style>
</head>
<body>
    <main aria-labelledby="title">
        <div class="brand">Thiscord</div>
        <h1 id="title">{{title}}</h1>
        <p id="message" role="status">{{message}}</p>
        {{form}}
        {{support}}
    </main>
</body>
</html>
