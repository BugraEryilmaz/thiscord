name: CI

on:
  push:
    # Feature branches are checked through pull requests; main is checked after merge.
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      api_url:
        type: string
        default: http://localhost:3000
      build_installers:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  THISCORD_DISABLE_LOCAL_CACHE: ${{ vars.THISCORD_DISABLE_LOCAL_CACHE }}
  THISCORD_API_URL: ${{ inputs.api_url || 'http://localhost:3000' }}

jobs:
  runners:
    uses: ./.github/workflows/select-runners.yml
    secrets: inherit

  format:
    name: Rust formatting
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)['ubuntu-24.04'] }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - name: Runner routing regression tests
        run: python3 scripts/test-select-runners.py

  backend:
    name: Backend and shared contracts
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)['ubuntu-24.04'] }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: thiscord
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: thiscord_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U thiscord -d thiscord_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Use the isolated test database port
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "DATABASE_URL=postgres://thiscord:ci-test-only@localhost:${POSTGRES_PORT}/thiscord_test?connect_timeout=3" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgres://thiscord:ci-test-only@localhost:${POSTGRES_PORT}/thiscord_test?connect_timeout=3" >> "$GITHUB_ENV"
      - name: PostgreSQL and TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev pkg-config cmake
      - name: Install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/cargo-cache
        with:
          key: backend
      - run: cargo clippy -p thiscord-shared -p thiscord-backend --all-targets --features thiscord-backend/load-test --locked -- -D warnings
      - name: Unit, wire-contract and PostgreSQL integration tests
        run: cargo test -p thiscord-shared -p thiscord-backend --locked -- --include-ignored
      - name: Voice load generator tests and real-peer smoke checks
        shell: bash
        run: |
          cargo test -p thiscord-backend --features load-test --example voice_load --example voice_load_server --locked -- --include-ignored
          cargo build -p thiscord-backend --features load-test --example voice_load --example voice_load_server --locked
          python3 scripts/voice-load-smoke.py "${CARGO_TARGET_DIR:-target}/debug/examples/voice_load_server" "${CARGO_TARGET_DIR:-target}/debug/examples/voice_load"
      - name: Apply application migrations
        run: cargo run -p thiscord-backend --locked -- --migrate-only
      - uses: ./.github/actions/cargo-tool
        with:
          crate: diesel_cli
          version: 2.3.13
          args: --no-default-features --features postgres
      - name: Verify generated Diesel schema
        working-directory: backend
        run: |
          diesel print-schema > "$RUNNER_TEMP/schema.rs"
          diff -u src/schema.rs "$RUNNER_TEMP/schema.rs"

  voice-load-macos:
    name: macOS voice load generator
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)['macos-latest'] }}
    steps:
      - uses: actions/checkout@v5
      - name: Native build dependencies
        run: |
          brew install libpq pkg-config cmake
          echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> "$GITHUB_ENV"
      - name: Install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/cargo-cache
        with:
          key: voice-load-macos
      - run: cargo clippy -p thiscord-backend --example voice_load --locked -- -D warnings
      - run: cargo test -p thiscord-backend --example voice_load --locked

  wasm:
    name: Leptos and Tailwind build
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)['ubuntu-24.04'] }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/cargo-cache
        with:
          key: wasm
      - run: cargo clippy -p thiscord-frontend --bin thiscord-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - uses: ./.github/actions/cargo-tool
        with:
          crate: trunk
          version: 0.21.14
      - name: Build production web assets
        working-directory: frontend
        run: trunk build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist/
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [wasm, runners]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)[matrix.os] }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev cmake
      - name: Install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/cargo-cache
        with:
          key: desktop-${{ matrix.os }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist
      - name: Lint native launcher
        run: cargo clippy -p thiscord-frontend --bin thiscord-desktop --features desktop,custom-protocol --locked -- -D warnings
      - name: Build native executable with embedded web assets
        run: cargo build -p thiscord-frontend --bin thiscord-desktop --features desktop,custom-protocol --locked
      - name: Screen codec and bounded RTP tests
        run: |
          cargo test -p thiscord-frontend --lib --features screen-share --locked screen::
      - name: Lint screen diagnostics
        run: cargo clippy -p thiscord-frontend --example screen_encode_probe --example screen_gpu_probe --example screen_preview_probe --features screen-share --locked -- -D warnings
      - name: Native callback tests
        run: cargo test -p thiscord-frontend --bin thiscord-desktop --features desktop,custom-protocol --locked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/debug/thiscord-desktop
            ${{ env.CARGO_TARGET_DIR }}/debug/thiscord-desktop.exe
          if-no-files-found: error

  audio:
    needs: runners
    name: Audio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)[matrix.os] }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev cmake
      - name: Install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/cargo-cache
        with:
          key: audio-${{ matrix.os }}
      - name: Native audio mixer, DSP, jitter and encrypted WebRTC probe
        run: cargo test -p thiscord-frontend --lib --example audio_replay --features deep-filter,neural-echo-probe --profile ci --locked
      - name: Lint audio stages, regressions and benchmarks
        run: cargo clippy -p thiscord-frontend --lib --tests --examples --features deep-filter,neural-echo-probe --profile ci --locked -- -D warnings
      - name: Build production benchmark executables together
        run: cargo build -p thiscord-frontend --example processing_bench --example neural_echo_bench --features deep-filter,neural-echo --release --locked
      - name: Audio processing benchmark (informational)
        shell: bash
        run: |
          cargo run -p thiscord-frontend --example processing_bench --features deep-filter,neural-echo --release --locked -- 300 > processing-bench.jsonl
          cargo run -p thiscord-frontend --example neural_echo_bench --features deep-filter,neural-echo --release --locked -- frontend/models/ree-v2.tflite > neural-echo-bench.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: audio-processing-${{ matrix.os }}
          path: |
            processing-bench.jsonl
            neural-echo-bench.jsonl
          if-no-files-found: error

  installers:
    if: inputs.build_installers && startsWith(github.ref, 'refs/tags/client-v')
    needs: [wasm, runners]
    uses: ./.github/workflows/build-installers.yml
    with:
      runner_routes: ${{ needs.runners.outputs.routes }}
    secrets: inherit
