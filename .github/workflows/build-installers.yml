name: Build client installers

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  THISCORD_DISABLE_LOCAL_CACHE: ${{ vars.THISCORD_DISABLE_LOCAL_CACHE }}
  THISCORD_API_URL: https://thiscord.com.tr
  # SHA-1 of the self-signed "Thiscord Release Signing" certificate. Changing it
  # makes every macOS user re-grant permissions once; see docs/releases.md.
  MACOS_SIGNING_SHA1: 2F0C37CC7A08EE7629D1041E7D99B372CBC36010

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-24.04
            runner: [self-hosted, Linux, X64]
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-latest
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            platform: darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust and target
        if: runner.os != 'Linux'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add $env:BUILD_TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: ./.github/actions/cargo-cache
        with:
          key: release-${{ matrix.target }}${{ runner.os == 'Linux' && '-ubuntu24-container' || '' }}
          local-group: ${{ runner.os == 'Linux' && 'ubuntu24-container' || 'native' }}
      - uses: ./.github/actions/cargo-tool
        if: runner.os != 'Linux'
        with:
          crate: tauri-cli
          version: 2.12.0
      - uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist
      - name: Build and sign installers
        if: runner.os != 'Linux'
        working-directory: frontend
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          # Assets already passed the production WASM build in the reusable CI.
          ../scripts/clear-installer-bundles.ps1 -TargetDirectory $env:CARGO_TARGET_DIR -Target $env:BUILD_TARGET
          '{"build":{"beforeBuildCommand":""}}' | Set-Content tauri.ci.conf.json
          if ($IsMacOS) {
            # macOS keys Screen Recording/microphone grants and Keychain access to
            # the designated requirement. Ad-hoc signatures change it every build.
            $identity = ../scripts/macos-signing.ps1 -Mode Import
            if ($identity -cne $env:MACOS_SIGNING_SHA1) { throw 'MACOS_SIGNING_CERTIFICATE is not the pinned release certificate.' }
            $env:APPLE_SIGNING_IDENTITY = $identity
          }
          cargo tauri build --ci --target $env:BUILD_TARGET --config tauri.ci.conf.json -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($IsMacOS) {
            $app = Join-Path $env:CARGO_TARGET_DIR "$env:BUILD_TARGET/release/bundle/macos/Thiscord.app"
            ../scripts/macos-signing.ps1 -Mode Verify -App $app -Certificate $env:MACOS_SIGNING_SHA1
          }
      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/macos-signing.ps1 -Mode Remove
      - name: Verify signatures and collect release artifacts
        if: runner.os != 'Linux'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_TARGET: ${{ matrix.target }}
          UPDATE_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/release-client.ps1 -Mode Collect -Tag $env:RELEASE_TAG -Target $env:BUILD_TARGET -Platform $env:UPDATE_PLATFORM
      - name: Build, sign and verify Linux installers in Ubuntu 24.04
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-linux-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Report Cargo storage
        if: always() && env.CARGO_TARGET_DIR != ''
        shell: pwsh
        run: ./scripts/maintain-cargo-builds.ps1 -BuildRoot $env:CARGO_TARGET_DIR | Format-Table -AutoSize
