name: Client release

on:
  push:
    tags: ['client-v*']

permissions:
  contents: read

# Serialize publication so a slower older tag cannot replace a newer release.
concurrency:
  group: client-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  THISCORD_DISABLE_LOCAL_CACHE: ${{ vars.THISCORD_DISABLE_LOCAL_CACHE }}
  THISCORD_API_URL: https://thiscord.com.tr

jobs:
  assets:
    name: Validate release and build web assets
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: Validate stable tag and package versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Configure the two TAURI_SIGNING_PRIVATE_KEY secrets before releasing.'
          }
          ./scripts/release-client.ps1 -Mode Validate -Tag $env:RELEASE_TAG

      - uses: ./.github/actions/cargo-cache
        with:
          key: wasm
      - uses: ./.github/actions/cargo-tool
        with:
          crate: trunk
          version: 0.21.14
      - name: Build production web assets
        working-directory: frontend
        run: trunk build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist/
          if-no-files-found: error

  installers:
    needs: assets
    uses: ./.github/workflows/build-installers.yml
    secrets: inherit

  publish:
    needs: installers
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: Ensure GitHub CLI is available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version
      - uses: ./.github/actions/cargo-cache
        with:
          key: release-verifier
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: release-artifacts
      - name: Verify complete release and publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release-client.ps1 -Mode Publish -Tag $env:RELEASE_TAG
