name: Client release

on:
  push:
    tags: ['client-v*']

permissions:
  contents: read

# Serialize publication so a slower older tag cannot replace a newer release.
concurrency:
  group: client-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  THISCORD_DISABLE_LOCAL_CACHE: ${{ vars.THISCORD_DISABLE_LOCAL_CACHE }}
  THISCORD_API_URL: https://thiscord.com.tr

jobs:
  runners:
    uses: ./.github/workflows/select-runners.yml
    secrets: inherit

  validate:
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)['ubuntu-24.04'] }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: Validate stable tag and package versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Configure the two TAURI_SIGNING_PRIVATE_KEY secrets before releasing.'
          }
          ./scripts/release-client.ps1 -Mode Validate -Tag $env:RELEASE_TAG

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      api_url: https://thiscord.com.tr
      build_installers: true
    secrets: inherit

  publish:
    needs: [checks, runners]
    runs-on: ${{ fromJSON(needs.runners.outputs.routes)['ubuntu-24.04'] }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: ./.github/actions/cargo-cache
        with:
          key: release-verifier
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: release-artifacts
      - name: Verify complete release and publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release-client.ps1 -Mode Publish -Tag $env:RELEASE_TAG
