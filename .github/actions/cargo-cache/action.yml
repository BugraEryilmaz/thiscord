name: Cargo build cache
description: Keep self-hosted build artifacts on disk; use GitHub caching on hosted runners.
inputs:
  key:
    description: Distinct build job and platform identifier
    required: true
  local-group:
    description: Compatible self-hosted jobs may share this group on one runner
    default: ''
runs:
  using: composite
  steps:
    - name: Select Cargo target directory
      shell: pwsh
      env:
        CACHE_JOB: ${{ inputs.key }}
        CACHE_GROUP: ${{ inputs.local-group }}
        CACHE_REPOSITORY: ${{ github.repository }}
        CACHE_RUNNER: ${{ runner.name }}
        CACHE_ENVIRONMENT: ${{ runner.environment }}
        CACHE_PR: ${{ github.event.pull_request.number }}
        CACHE_DISABLED: ${{ env.THISCORD_DISABLE_LOCAL_CACHE }}
      run: |
        $local = $env:CACHE_ENVIRONMENT -eq 'self-hosted' -and $env:CACHE_DISABLED -ne 'true'
        $target = Join-Path $env:GITHUB_WORKSPACE 'target'
        if ($local) {
          # GitHub runs one job at a time per runner service. Compatible jobs
          # share artifacts; separate runners and PRs retain distinct directories.
          $group = if ($env:CACHE_GROUP) { $env:CACHE_GROUP } else { $env:CACHE_JOB }
          $scope = "$env:CACHE_REPOSITORY/$env:CACHE_RUNNER/$group/pr-$env:CACHE_PR"
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($scope))).Replace('-', '').ToLowerInvariant()
          $sha.Dispose()
          # MSVC/CMake append deep scratch and PDB paths. Keep Windows roots short
          # while retaining a 128-bit scope hash for runner/job isolation.
          $relative = if ($IsWindows) { "tc/$($hash.Substring(0, 32))" } else { "thiscord-cargo/$hash" }
          $target = Join-Path (Split-Path $env:RUNNER_TEMP -Parent) $relative
        }
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
        "THISCORD_LOCAL_CACHE=$($local.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
        Write-Output "Cargo target directory: $target (persistent: $local)"
    - uses: Swatinem/rust-cache@v2
      if: env.THISCORD_LOCAL_CACHE != 'true'
      with:
        key: ${{ inputs.key }}
        cache-workspace-crates: 'true'
        cache-on-failure: 'true'
        # Pinned tools have their own independent caches.
        cache-bin: 'false'
