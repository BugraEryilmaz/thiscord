  "activity_status",
  "activity_set_enabled",
  "activity_set_games",
  "activity_programs",
  "take_pending_invite",
  "load_session",
  "save_session",
  "save_bot_credential",
  "clear_session",
  "prepare_google",
  "open_google",
  "cancel_google",
  "open_external_url",
  "audio_devices",
  "voice_message_record_start",
  "voice_message_record_stop",
  "voice_message_record_cancel",
  "voice_message_upload",
  "voice_message_play",
  "voice_message_control",
  "voice_message_reset",
  "audio_load",
  "audio_current",
  "audio_save",
  "audio_toggle",
  "audio_shortcuts",
  "audio_shortcuts_save",
  "audio_restrict",
  "audio_test",
  "audio_stop",
  "audio_status",
  "audio_debug_start",
  "audio_debug_stop",
  "audio_debug_folder",
  "audio_diagnostics_folder",
  "audio_diagnostics_enabled",
  "audio_diagnostics_enable",
  "audio_volume",
  "audio_pressed",
  "audio_webrtc_probe",
  "camera_prepare",
  "camera_open",
  "camera_keepalive",
  "camera_stop",
  "screen_status",
  "screen_view_diagnostics",
  "screen_view_keyframe",
  "screen_view_open",
  "screen_view_keepalive",
  "screen_bridge_report",
  "screen_bridge_probe",
  "screen_sources",
  "screen_start",
  "screen_stop",
  "voice_join",
  "voice_leave",
  "voice_status",
  "voice_soundboard_play",
  "soundboard_volume",
  "soundboard_set_volume",
  "overlay_snapshot",
  "overlay_settings",
  "overlay_settings_save",
  "overlay_action",
  "update_status",
  "update_check",
  "update_install",
