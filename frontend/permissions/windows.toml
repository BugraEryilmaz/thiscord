[[permission]]
identifier = "main-commands"
description = "Account, media and settings commands for the main window only."
commands.allow = [
  "notification_show",
  "notification_clear",
  "notification_remove",
  "notification_sync_calls",
  "notification_snoozed",
  "notification_sound",
  "window_close_to_tray",
  "window_set_close_to_tray",
  "load_session",
  "save_session",
  "clear_session",
  "prepare_google",
  "open_google",
  "cancel_google",
  "audio_devices",
  "audio_load",
  "audio_current",
  "audio_save",
  "audio_toggle",
  "audio_shortcuts",
  "audio_shortcuts_save",
  "audio_restrict",
  "audio_test",
  "audio_stop",
  "audio_status",
  "audio_debug_start",
  "audio_debug_stop",
  "audio_debug_folder",
  "audio_diagnostics_folder",
  "audio_diagnostics_enabled",
  "audio_diagnostics_enable",
  "audio_volume",
  "audio_pressed",
  "audio_webrtc_probe",
  "camera_prepare",
  "camera_open",
  "camera_keepalive",
  "camera_stop",
  "screen_status",
  "screen_view_diagnostics",
  "screen_view_keyframe",
  "screen_view_open",
  "screen_view_keepalive",
  "screen_sources",
  "screen_start",
  "screen_stop",
  "voice_join",
  "voice_leave",
  "voice_status",
  "overlay_snapshot",
  "overlay_enabled",
  "overlay_enable",
  "update_status",
  "update_check",
  "update_install",
]

[[permission]]
identifier = "overlay-read"
description = "Read presentation-only voice metadata."
commands.allow = ["overlay_snapshot"]

[[permission]]
identifier = "overlay-self-controls"
description = "Toggle only the local microphone mute and deafen while connected to voice."
commands.allow = ["overlay_toggle_audio"]

[[permission]]
identifier = "notification-banner"
description = "Read notification presentation, fit its window to the current cards, and act on an existing banner; no account or media commands."
commands.allow = ["notification_snapshot", "notification_action", "notification_resize"]
