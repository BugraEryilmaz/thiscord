[package]
name = "thiscord-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "thiscord-desktop"

[features]
default = []
desktop = ["screen-share", "dep:tauri", "dep:tauri-build", "dep:keyring", "dep:open", "dep:tokio", "dep:rand", "dep:base64", "dep:url", "native-audio", "deep-filter", "neural-echo", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-updater", "dep:tokio-tungstenite", "dep:futures-util"]
screen-share = ["native-audio", "dep:windows-capture", "dep:windows", "dep:openh264", "dep:image", "dep:wasapi"]
native-audio = ["dep:cpal", "dep:ringbuf", "dep:opus", "dep:webrtc", "dep:tokio", "dep:bytes", "dep:rtc", "dep:async-trait", "dep:sonora", "dep:hound"]
deep-filter = ["native-audio", "dep:deep_filter", "dep:ndarray", "dep:tract-core", "dep:tract-hir", "dep:tract-onnx", "dep:tract-pulse"]
release-tools = ["dep:base64", "dep:minisign-verify"]
neural-echo = ["native-audio", "dep:tract-tflite", "dep:sha2", "dep:rustfft"]
neural-echo-probe = ["neural-echo"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "thiscord-ui"
path = "src/main.rs"

[[bin]]
name = "thiscord-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[[example]]
name = "verify_update"
required-features = ["release-tools"]

[[example]]
name = "processing_bench"
required-features = ["deep-filter"]

[[example]]
name = "neural_echo_probe"
required-features = ["neural-echo-probe"]

[[example]]
name = "neural_echo_bench"
required-features = ["neural-echo", "deep-filter"]

[[example]]
name = "audio_replay"
required-features = ["neural-echo", "deep-filter"]

[[example]]
name = "screen_encode_probe"
required-features = ["screen-share"]

[[example]]
name = "screen_preview_probe"
required-features = ["screen-share"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hound = "3.5"

[dependencies]
thiscord-shared.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = "0.6"
futures-util = { version = "0.3", features = ["sink"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "HtmlDialogElement", "DomRect", "Crypto", "Document", "HtmlElement", "Navigator", "Clipboard", "HtmlVideoElement", "MediaStream", "MediaStreamTrack", "RtcPeerConnection", "RtcConfiguration", "RtcSessionDescriptionInit", "RtcSessionDescription", "RtcSdpType", "RtcTrackEvent", "RtcRtpTransceiverInit", "RtcRtpTransceiverDirection", "RtcRtpTransceiver", "RtcIceGatheringState", "RtcPeerConnectionState"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openh264 = { version = "=0.9.8", optional = true }
image = { version = "0.25", default-features = false, optional = true }
hound = { version = "3.5", optional = true }
tauri = { version = "2", optional = true , features = [] }
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
open = { version = "5", optional = true }
tokio = { version = "1", optional = true, features = ["net", "time", "io-util", "sync", "macros"] }
rand = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
url = { version = "2", optional = true }
cpal = { version = "0.18.2", optional = true }
sonora = { version = "0.2.0", optional = true }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# DFN's ^0.21.4 constraint permits incompatible ndarray/API changes in later
# tract patch releases. Keep all four upstream inference entry points aligned.
tract-core = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
tract-tflite = { version = "=0.21.4", optional = true }
sha2 = { version = "0.10", optional = true }
rustfft = { version = "6", optional = true }
ringbuf = { version = "0.5.2", optional = true }
opus = { version = "0.4.0", optional = true }
webrtc = { version = "0.21.0", optional = true }
bytes = { version = "1", optional = true }
rtc = { version = "0.21.0", optional = true }
async-trait = { version = "0.1", optional = true }
tauri-plugin-global-shortcut = { version = "2.4", optional = true }
tauri-plugin-updater = { version = "2.13", optional = true }
minisign-verify = { version = "0.2.5", optional = true }
tokio-tungstenite = { version = "0.29", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = { version = "=2.0.1", optional = true }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole"], optional = true }
wasapi = { version = "0.22", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
