[package]
name = "thiscord-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "thiscord-desktop"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "thiscord-ui"
path = "src/main.rs"

[[bin]]
name = "thiscord-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[dependencies]
thiscord-shared.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = "0.6"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri = { version = "2", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "2", optional = true }
