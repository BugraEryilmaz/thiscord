[package]
name = "thiscord-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "thiscord-desktop"

[features]
default = []
welcome = []
scripting-bot = ["dep:reqwest", "dep:keyring", "dep:uuid", "dep:tokio", "tokio/rt-multi-thread", "tokio/process", "tokio/signal", "dep:tokio-tungstenite", "dep:futures-util", "dep:webrtc", "dep:rtc", "dep:bytes", "dep:opus", "dep:async-trait", "dep:rand"]
voice-bot = ["native-audio", "deep-filter", "neural-echo", "dep:openh264", "tokio/rt-multi-thread", "tokio/io-std"]
desktop = ["dep:objc2", "dep:objc2-web-kit", "dep:block2", "screen-share", "dep:tauri", "dep:tauri-build", "dep:keyring", "dep:open", "dep:tokio", "dep:rand", "dep:base64", "native-audio", "deep-filter", "neural-echo", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-deep-link", "dep:tokio-tungstenite", "dep:futures-util"]
screen-share = ["native-audio", "dep:windows-capture", "dep:windows", "dep:windows-core", "dep:openh264", "dep:wasapi"]
native-audio = ["dep:cpal", "dep:ringbuf", "dep:opus", "dep:webrtc", "dep:tokio", "dep:bytes", "dep:rtc", "dep:async-trait", "dep:sonora", "dep:hound", "dep:windows", "dep:socket2"]
deep-filter = ["native-audio", "dep:deep_filter", "dep:ndarray", "dep:tract-core", "dep:tract-hir", "dep:tract-onnx", "dep:tract-pulse"]
release-tools = ["dep:base64", "dep:minisign-verify"]
neural-echo = ["native-audio", "dep:tract-tflite", "dep:sha2", "dep:rustfft"]
neural-echo-probe = ["neural-echo"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "thiscord-ui"
path = "src/main.rs"

[[bin]]
name = "thiscord-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "thiscord-voice-bot"
path = "src/voice_bot.rs"
required-features = ["voice-bot"]

[[example]]
name = "bot_echo"
path = "../bots/examples/echo.rs"
required-features = ["scripting-bot"]

[[example]]
name = "bot_music"
path = "../bots/examples/music.rs"
required-features = ["scripting-bot"]

[[example]]
name = "bot_manage"
path = "../bots/examples/manage.rs"
required-features = ["scripting-bot"]

[[example]]
name = "verify_update"
required-features = ["release-tools"]

[[example]]
name = "processing_bench"
required-features = ["deep-filter"]

[[example]]
name = "dtx_bench"
required-features = ["native-audio"]

[[example]]
name = "neural_echo_probe"
required-features = ["neural-echo-probe"]

[[example]]
name = "neural_echo_bench"
required-features = ["neural-echo", "deep-filter"]

[[example]]
name = "audio_replay"
required-features = ["neural-echo", "deep-filter"]

[[example]]
name = "screen_encode_probe"
required-features = ["screen-share"]

[[example]]
name = "screen_gpu_probe"
required-features = ["screen-share"]

[[example]]
name = "screen_preview_probe"
required-features = ["screen-share"]

[[example]]
name = "screen_pipeline_probe"
required-features = ["screen-share"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hound = "3.5"

[dependencies]
thiscord-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
linkify = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
leptos = { version = "0.8", features = ["csr"] }
gloo-net = "0.6"
futures-util = { version = "0.3", features = ["sink"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Performance", "DragEvent", "DataTransfer", "XmlHttpRequest", "XmlHttpRequestEventTarget", "XmlHttpRequestUpload", "XmlHttpRequestResponseType", "ProgressEvent", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "OscillatorNode", "GainNode", "Storage", "StorageEvent", "NodeList", "Url", "BlobPropertyBag", "HtmlAnchorElement", "ResizeObserver", "ResizeObserverEntry", "File", "FileList", "Blob", "HtmlInputElement", "Window", "Location", "HtmlDialogElement", "DomRect", "Crypto", "Document", "HtmlElement", "Navigator", "Clipboard", "HtmlVideoElement", "MediaStream", "MediaStreamTrack", "MediaStreamTrackState", "MediaDevices", "MediaStreamConstraints", "MediaTrackConstraints", "RtcRtpSender", "RtcRtpParameters", "RtcRtpEncodingParameters", "RtcPeerConnection", "RtcDataChannel", "RtcConfiguration", "RtcSessionDescriptionInit", "RtcSessionDescription", "RtcSdpType", "RtcTrackEvent", "RtcRtpReceiver", "RtcRtpTransceiverInit", "RtcRtpTransceiverDirection", "RtcRtpTransceiver", "RtcIceGatheringState", "RtcPeerConnectionState", "RtcStatsReport", "VideoPlaybackQuality"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
openh264 = { version = "=0.9.8", optional = true }
hound = { version = "3.5", optional = true }
tauri = { version = "2", optional = true , features = ["macos-private-api", "tray-icon"] }
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
open = { version = "5", optional = true }
tokio = { version = "1", optional = true, features = ["net", "time", "io-util", "sync", "macros"] }
rand = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
cpal = { version = "0.18.2", optional = true }
sonora = { version = "0.2.0", optional = true }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# DFN's ^0.21.4 constraint permits incompatible ndarray/API changes in later
# tract patch releases. Keep all four upstream inference entry points aligned.
tract-core = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
tract-tflite = { version = "=0.21.4", optional = true }
sha2 = { version = "0.10", optional = true }
rustfft = { version = "6", optional = true }
ringbuf = { version = "0.5.2", optional = true }
opus = { version = "0.4.0", optional = true }
webrtc = { version = "0.21.0", optional = true }
socket2 = { version = "0.6", optional = true }
bytes = { version = "1", optional = true }
rtc = { version = "0.21.0", optional = true }
async-trait = { version = "0.1", optional = true }
tauri-plugin-global-shortcut = { version = "2.4", optional = true }
tauri-plugin-updater = { version = "2.13", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true, features = ["deep-link"] }
tauri-plugin-deep-link = { version = "2", optional = true }
minisign-verify = { version = "0.2.5", optional = true }
tokio-tungstenite = { version = "0.29", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = { version = "=2.0.1", optional = true }
windows-core = { version = "0.62.2", optional = true }
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Wmi"], optional = true }
wasapi = { version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit", "block2"], optional = true }
block2 = { version = "0.6", optional = true }

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", optional = true , features = [] }
